[package]
name = "flux"
version = "1.2.4"
edition = "2024"

[lib]
name = "flux"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
toml_edit = "0.22"
anyhow = "1.0"
colored = "2.1"
dialoguer = "0.11"
git2 = "0.18"
dirs = "5.0"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
pathdiff = "0.2"
walkdir = "2"
log = "0.4"
env_logger = "0.11"
nix = { version = "0.27", features = ["process", "fs"] }
shellexpand = "3.1"
uuid = { version = "1.6", features = ["v4"] }
tempfile = "3.8"

[dev-dependencies]
tempfile = "3.8"
