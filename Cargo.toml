[package]
name = "flux"
version = "1.2.4"
edition = "2024"

[lib]
name = "flux"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"
toml_edit = "0.23"
anyhow = "1.0"
colored = "3.0"
dialoguer = "0.12"
git2 = "0.20.3"
dirs = "6.0"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0.17"
pathdiff = "0.2"
walkdir = "2"
log = "0.4"
env_logger = "0.11"
nix = { version = "0.30.1", features = ["process", "fs"] }
shellexpand = "3.1"
uuid = { version = "1.6", features = ["v4"] }
tempfile = "3.8"

[dev-dependencies]
tempfile = "3.8"

[lints.clippy]
panic = "warn"
unwrap_used = "warn"
expect_used = "warn"
todo = "warn"
dbg_macro = "warn"