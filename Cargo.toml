[workspace]
resolver = "2"
members = ["crates/cli", "crates/lib"]

[workspace.lints.clippy]
collapsible_match = "warn"
complexity = { level = "warn", priority = 1 }
correctness = { level = "deny", priority = 2 }
enum_glob_use = "warn"
expect_used = "warn"
indexing_slicing = "warn"
inefficient_to_string = "warn"
large_enum_variant = "warn"
large_types_passed_by_value = "warn"
match_bool = "warn"
match_ref_pats = "warn"
match_same_arms = "warn"
match_single_binding = "warn"
min_ident_chars = "warn"
missing_docs_in_private_items = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
needless_bool = "deny"
needless_late_init = "warn"
needless_match = "warn"
panic = "deny"
pedantic = { level = "warn", priority = 1 }
perf = { level = "warn", priority = 1 }
redundant_guards = "warn"
redundant_pattern = "warn"
redundant_pattern_matching = "warn"
similar_names = "warn"
single_match = "warn"
single_match_else = "warn"
style = { level = "warn", priority = 1 }
suspicious = { level = "deny", priority = 1 }
too_many_arguments = "warn"
too_many_lines = "warn"
type_complexity = "warn"
unnecessary_owned_empty_strings = "warn"
unused_enumerate_index = "warn"
unused_format_specs = "warn"
unused_io_amount = "warn"
unused_peekable = "warn"
unused_rounding = "warn"
unused_self = "warn"
unused_unit = "warn"
unwrap_used = "deny"
useless_attribute = "warn"
wildcard_dependencies = "warn"
wildcard_enum_match_arm = "warn"
wildcard_imports = "warn"
wildcard_in_or_patterns = "warn"

[workspace.lints.rust]
dead_code = "warn"
deprecated = "warn"
missing_copy_implementations = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unsafe_code = "deny"
unused_attributes = "warn"
unused_extern_crates = "warn"
unused_imports = "warn"
unused_macros = "warn"
unused_must_use = "warn"
unused_qualifications = "warn"
unused_results = "warn"
unused_variables = "warn"
