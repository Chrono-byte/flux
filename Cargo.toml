[package]
name = "flux"
version = "1.3.0"
edition = "2024"

[lib]
name = "flux"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"
toml_edit = "0.23"
anyhow = "1.0"
colored = "3.0"
dialoguer = "0.12"
git2 = "0.20.3"
dirs = "6.0"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0.17"
pathdiff = "0.2"
walkdir = "2"
log = "0.4"
env_logger = "0.11"
nix = { version = "0.30.1", features = ["process", "fs"] }
shellexpand = "3.1"
uuid = { version = "1.6", features = ["v4"] }
tempfile = "3.8"

[dev-dependencies]
tempfile = "3.8"

[lints.clippy]
# Core correctness - catch bugs early
correctness = { level = "deny", priority = 1 }
suspicious = { level = "deny", priority = 1 }

# Performance - important for CLI responsiveness
perf = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"

# Complexity - keep code maintainable
complexity = { level = "warn", priority = 1 }

# Style - encourage good practices
enum_glob_use = "warn"
too_many_arguments = "warn"  # Encourage refactoring complex functions
missing_docs_in_private_items = "warn"  # Improve maintainability

# Match patterns - allow some flexibility for file/path handling
single_match = "warn"
single_match_else = "warn"
needless_match = "warn"
needless_late_init = "warn"
redundant_pattern_matching = "warn"
redundant_pattern = "warn"
redundant_guards = "warn"
collapsible_match = "warn"
match_single_binding = "warn"
match_same_arms = "warn"
match_ref_pats = "warn"
match_bool = "warn"
needless_bool = "deny"

panic = "deny"

# File/path operations may use indexing
indexing_slicing = "warn"
min_ident_chars = "warn"  # Encourage meaningful names
type_complexity = "deny"  # Encourage simpler types where possible
cognitive_complexity = "deny"  # Warn about overly complex functions

# Enable pedantic checks selectively
pedantic = { level = "warn", priority = 1 }
# nursery = { level = "warn", priority = 2 }  # Enable selectively