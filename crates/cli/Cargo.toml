[package]
name = "flux-cli"
version = "1.5.2"
edition = "2024"

[[bin]]
name = "flux"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
flux-lib = { path = "../lib" }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
colored = "3.0"
dialoguer = "0.12"
dirs = "6.0"
env_logger = "0.11"
git2 = "0.20.3"
hostname = "0.4.2"
indicatif = "0.18"
log = "0.4"
nix = { version = "0.31.2", features = ["fs", "process"] }
pathdiff = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shellexpand = "3.1"
tempfile = "3.8"
thiserror = "2.0.17"
tokio = { version = "1.0", features = ["rt", "rt-multi-thread", "time"] }
toml = "1.0"
toml_edit = "0.25"
uuid = { version = "1.6", features = ["v4"] }
walkdir = "2"
which = "8.0.0"
atty = "0.2"

[dev-dependencies]
