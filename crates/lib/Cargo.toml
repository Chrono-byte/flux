[package]
name = "flux-lib"
version = "1.5.6"
edition = "2024"

[lib]
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
colored = "3.0"
dialoguer = "0.12"
dirs = "6.0"
env_logger = "0.11"
git2 = "0.20.3"
hostname = "0.4.2"
indicatif = "0.18"
log = "0.4"
nix = { version = "0.31.2", features = ["fs", "process"] }
pathdiff = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shellexpand = "3.1"
tempfile = "3.8"
thiserror = "2.0.17"
tokio = { version = "1.0", features = ["rt", "rt-multi-thread", "time"] }
toml = "1.0"
toml_edit = "0.25"
uuid = { version = "1.6", features = ["v4"] }
walkdir = "2"
which = "8.0.0"
once_cell = "1"

[dev-dependencies]
