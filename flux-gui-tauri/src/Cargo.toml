[package]
name = "flux-gui"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
leptos = "0.6"
leptos_use = "0.10"
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = { version = "0.2", features = ["js"] }
chrono = { version = "0.4", features = ["serde"] }
serde_wasm_bindgen = "0.6"

[dependencies.web-sys]
version = "0.3"
features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "Node",
    "Event",
    "KeyboardEvent",
]

[dependencies.js-sys]
version = "0.3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
