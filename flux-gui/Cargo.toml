[package]
name = "flux-gui"
version = "1.3.3"
edition = "2024"
publish = false

[[bin]]
name = "flux-gui"
path = "src/main.rs"

[dependencies]
# Core framework - GPUI from Zed
# Building GPUI can take 5-10 minutes on first build
gpui = { git = "https://github.com/zed-industries/zed", branch = "main" }
tokio = { version = "1", features = ["full", "sync"] }

# Local
flux = { path = ".." }

# UI/Native
rfd = "0.14"
parking_lot = "0.12"
futures = "0.3"

# Serialization & Config
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
toml_edit = "0.24"

# Error Handling
anyhow = "1.0"
thiserror = "2.0"

# Logging
log = "0.4"
env_logger = "0.11"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Misc
notify = "6.0"
pathdiff = "0.2"
shellexpand = "3.1"
dirs = "6.0"
serde_json = "1.0"
uuid = { version = "1.6", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.8"

[lints.clippy]
complexity = { level = "warn", priority = 1 }
correctness = { level = "deny", priority = 2 }
missing_docs_in_private_items = "warn"
panic = "deny"
pedantic = { level = "warn", priority = 1 }
perf = { level = "warn", priority = 1 }
style = { level = "warn", priority = 1 }
suspicious = { level = "deny", priority = 1 }
unwrap_used = "deny"

[lints.rust]
dead_code = "warn"
missing_docs = "warn"
unsafe_code = "deny"
unused_imports = "warn"
unused_variables = "warn"
